<text x="332" y="1253.0" font-size="15" fill="#c62828" font-weight="700">Red alert</text>
<text x="410" y="1253.0" font-size="15" fill="#1f2a44">— a data hold, lost sales history, an order jump of 50%+ or an overstock-to-stockout swing is escalated to procurement and the planner the same day, not at the next monthly review.</text>
